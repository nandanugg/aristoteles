# The questions that work role fit prints. A role fits when every static check passes and
# every answer is yes, with one real example of the role's work as the reason.
questions:
  - id: 1
    short: one kind of work
    ask: Can the role do its work on one kind of output (a maker), or on one kind of review?
  - id: 2
    short: a clear end
    ask: Does a responsibility say when one unit is done, in a way that a review can check?
  - id: 3
    short: enough in the brief
    ask: Can an agent on the model of this role do one unit from its brief alone, with no knowledge of other tasks?
  - id: 4
    short: judgment that fits the model
    ask: Does the role decide only what its acts give it, on a model strong enough for that care (a maker executes, a role that reviews judges, a role that splits or directs keeps the directions)?
  - id: 5
    short: a checking load that fits
    ask: Can each rule that names the role be checked by looking at one place, or by one test command?
  - id: 6
    short: words that work
    ask: Does each responsibility name the exact output and the exact command?
  - id: 7
    short: a way to stop
    ask: Does the role know when to raise the task instead of guessing?
