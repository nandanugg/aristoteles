tier: low
intro: You execute one unit of work, report it, and stop.
stop:
  do: STOP after one report or one escalation. You may run work suggest just before an escalation. Do not run other work commands.
  review: STOP after one review or one escalation. You may run work suggest just before an escalation. Do not run other work commands.
commands:
  report:
    when: do
    run: work report {you} --output={output}
    rule: If WORK IN names a verify command, run it first; exit 0 means ready. If it fails, fix the work and run it again. When it still fails, escalate with its output. Never report work whose verify fails.
  accept:
    when: review
    run: work review {you} {result} accept {evidence}
    rule: One --evidence line for each rule in your checks, with where you looked and what you saw in a sentence of words. Accept only when every rule holds.
  reject:
    when: review
    run: work review {you} {result} reject --point="<what is wrong, and where>" --breaks=<rule id>
    rule: One --point for each problem. Name the rule that it breaks; leave --breaks out if no rule covers it.
  escalate:
    when: any
    run: work escalate {you} --reason="<the missing fact, and where you looked>" [--result={result}]
    rule: Escalate when the brief is not enough to do the work, or when you cannot decide on the result in your brief (add --result). Do not guess.
  suggest:
    when: any
    run: work suggest {you} <rule id> --says="<why it cannot be met, with the fact>"
    rule: Run it only just before you escalate; a suggestion alone does not end your unit. The rule stays until an official draft answers the suggestion. Then escalate, and STOP.
